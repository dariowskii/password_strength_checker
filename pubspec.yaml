name: password_strength_checker
description: Animated password strength bar, form validation with a minimum strength, 10k leaked password check and a secure password generator.
version: 2.0.0
issue_tracker: https://github.com/dariowskii/password_strength_checker/issues
topics: [password, password-strength, security, form, validation]
homepage: https://github.com/dariowskii/password_strength_checker
repository: https://github.com/dariowskii/password_strength_checker

environment:
  sdk: ^3.9.0
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

screenshots:
  - description: Animated strength bar with PasswordStrengthChecker
    path: screenshots/demo.webp
  - description: Form validation with PasswordStrengthFormChecker
    path: screenshots/demo_form.webp
  - description: Secure password generator
    path: screenshots/demo_generator.webp
